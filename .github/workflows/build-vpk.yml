name: Build Vita VPK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: vitasdk/vitasdk:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Prepare missing build helpers
        run: |
          if [ ! -f "native-bench/vendor/libpng/png.c" ]; then
            mkdir -p native-bench/vendor/libpng
            curl -L https://github.com/pnggroup/libpng/archive/refs/tags/v1.6.43.tar.gz | tar -xz --strip-components=1 -C native-bench/vendor/libpng
            cp native-bench/vendor/libpng/scripts/pnglibconf.h.prebuilt native-bench/vendor/libpng/pnglibconf.h
            rm -f native-bench/vendor/libpng/pngtest.c
          fi
          if [ ! -f "platform/vita/gpu_translator_archive.py" ]; then
            cat << 'EOF' > platform/vita/gpu_translator_archive.py
          import argparse, shutil, subprocess
          p = argparse.ArgumentParser()
          p.add_argument("--ar", required=True)
          p.add_argument("--objcopy", required=True)
          p.add_argument("src")
          p.add_argument("dst")
          a = p.parse_args()
          shutil.copyfile(a.src, a.dst)
          members = subprocess.check_output([a.ar, "t", a.dst], text=True).splitlines()
          for m in members:
              if "global" in m.lower():
                  subprocess.check_call([a.ar, "d", a.dst, m])
          EOF
          fi
          if [ ! -f "platform/vita/mixer_archive.py" ]; then
            cat << 'EOF' > platform/vita/mixer_archive.py
          import argparse, shutil
          p = argparse.ArgumentParser()
          p.add_argument("--ar", required=True)
          p.add_argument("src")
          p.add_argument("dst")
          a = p.parse_args()
          shutil.copyfile(a.src, a.dst)
          EOF
          fi

      - name: Build VPK
        run: |
          FFMPEG_SCRIPT=$(find . -maxdepth 4 -name "*ffmpeg*.sh" | head -n 1)
          EXTRA_ARGS=""
          if [ -n "$FFMPEG_SCRIPT" ]; then
            echo "Found FFmpeg script: $FFMPEG_SCRIPT"
            bash "$FFMPEG_SCRIPT"
          elif [ -f "$VITASDK/arm-vita-eabi/lib/libavcodec.a" ]; then
            echo "Using preinstalled VitaSDK FFmpeg"
            EXTRA_ARGS="-DONS_FFMPEG_ROOT=$VITASDK/arm-vita-eabi"
          fi
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$VITASDK/share/vita.toolchain.cmake" -DCMAKE_BUILD_TYPE=Release -DONS_VITA_EXPORT_SHADERS=ON $EXTRA_ARGS
          make -j$(nproc)

      - name: Upload VPK
        uses: actions/upload-artifact@v4
        with:
          name: umineko-vpk
          path: "**/*.vpk"
